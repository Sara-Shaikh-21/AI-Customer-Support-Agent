name: Build and Deploy CommerceAI

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: commerceai-backend
  CONTAINER_APP_NAME: commerceai-api
  RESOURCE_GROUP: rg-sara.shaikh.21-8249

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/commerceai-backend:latest .

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/commerceai-backend:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: docker.io/${{ secrets.DOCKER_USERNAME }}/commerceai-backend:latest
          containerAppName: commerceai-api
          resourceGroup: rg-sara.shaikh.21-8249